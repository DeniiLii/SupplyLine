name: CI

on:
  push:
    branches: [main, sprint-1]
  pull_request:

env:
  SUPPLYLINE_MOCK_LATENCY: "0"
  PYTHONIOENCODING: utf-8

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: LibreOffice для пересчёта вариантов книги
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Сценарий жюри (pytest -m e2e) и песочница
        run: pytest -q -m e2e
      - name: Смоук-тест Docker-режима (песочница)
        run: |
          SUPPLYLINE_SANDBOX=1 SUPPLYLINE_DB=/tmp/sl/template.sqlite3 SUPPLYLINE_SESSIONS_DIR=/tmp/sl/sessions \
            python -m uvicorn api.main:app --port 8000 &
          python scripts/smoke.py http://127.0.0.1:8000 --wait 60
